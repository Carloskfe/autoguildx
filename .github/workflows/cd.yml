name: CD

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy to production (Contabo)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 84.247.140.175
          username: root
          port: 222
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/autoguildx
            git pull origin main
            # Remove any stale containers with hash-prefixed names that block compose
            docker ps -a --format '{{.Names}}' | grep -E 'autoguildx-(web|api|db)' | xargs -r docker rm -f 2>/dev/null || true
            docker compose --env-file .env.production -f docker-compose.server.yml up -d --build --remove-orphans
            docker compose --env-file .env.production -f docker-compose.server.yml exec -T api npm run migration:run:prod
            docker image prune -f
