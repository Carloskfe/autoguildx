# Production Docker Compose — uses nginx for SSL termination.
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Required variables in .env.prod (see .env.prod.example):
#   DOMAIN_NAME       e.g. autoguildx.com
#   POSTGRES_PASSWORD strong random password
#   EMAIL             your email for Let's Encrypt notifications

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: autoguildx
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d autoguildx']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/autoguildx
      NODE_ENV: production
      FRONTEND_URL: https://${DOMAIN_NAME:?set DOMAIN_NAME in .env.prod}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/api/v1/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN_NAME}/api/v1
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - ./apps/web/.env
    environment:
      API_URL: http://api:3001/api/v1
      NEXT_PUBLIC_SITE_URL: https://${DOMAIN_NAME}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    depends_on:
      - api
      - web

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Renew every 12 h; certificates are valid 90 days, renewed at 30-day mark
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"

volumes:
  pgdata:
